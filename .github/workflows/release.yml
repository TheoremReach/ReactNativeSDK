name: Release (stage the npm publish)

# On demand only. Stages the package's publish to npm through trusted publishing, which signs its provenance with no
# saved token; a maintainer then approves the staged release on npmjs.com with 2FA. A dry run, the default, checks,
# builds and packs, and neither tags nor stages.
#
# Two jobs, so nothing that runs a dependency's code can mint npm's token:
# - pack checks that the version is package.json's and npm doesn't have it, that CI passed on this commit, and that a
#   real release runs on master; then it builds and packs, with no id-token;
# - publish, on master only and in the `npm` environment (its branch rule is master), installs nothing: it tags the
#   commit and stages pack's tarball, with lifecycle scripts off.
#
# A tag already on this run's commit is taken as this release's, so the workflow can run again.
#
# The push trigger only registers the workflow, so it can be dispatched on a branch before it reaches master. Its jobs
# run on dispatch alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, which package.json must declare
        required: true
      dry_run:
        description: Dry run (check, build and pack; don't tag or stage)
        type: boolean
        default: true
  push:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pack:
    name: Check, build and pack
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # CI's runs on this commit
    outputs:
      already_tagged: ${{ steps.check.outputs.already_tagged }}
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      PACKAGE: '@theoremreachnpm/react-native-theoremreach'

    steps:
      # No saved credentials: only the steps that need a token get one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/master ]; then
            echo "::error::A release runs on master, not $GITHUB_REF: dry runs only elsewhere"
            exit 1
          fi
          declared=$(node -p "require('./package.json').version")
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::package.json declares $declared, not $VERSION"
            exit 1
          fi
          if npm view "$PACKAGE@$VERSION" version > /dev/null 2>&1; then
            echo "::error::npm already has $PACKAGE@$VERSION"
            exit 1
          fi

          # CI's newest run on this commit must have passed: on master, the run its push started. A pull request's runs
          # name its branch's head, so on a branch (a dry run) any run of this commit counts.
          if [ "$GITHUB_REF" = refs/heads/master ]; then
            filters=(--branch master --event push)
          else
            filters=()
          fi
          ci=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" "${filters[@]}" --limit 1 \
            --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          if [ "$ci" != "completed success" ]; then
            echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not a success"
            exit 1
          fi

          # The tag, if there is one. matching-refs answers [] for none, where a lookup by name answers a 404 body; a
          # call that fails fails the step.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" \
            --jq '.[] | select(.ref == "refs/tags/" + env.VERSION) | .object.type + " " + .object.sha')
          if [ -n "$tagged" ]; then
            tagged_commit=${tagged#* }
            if [ "${tagged%% *}" = tag ]; then
              tagged_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tagged_commit" --jq .object.sha)
            fi
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::The tag $VERSION names $tagged_commit, not this run's commit. If nothing was released from that commit, delete the tag and run again."
              exit 1
            fi
            echo "The tag $VERSION names this commit already (a run that didn't finish)"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and pack
        run: |
          yarn prepare
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -tzf "$RUNNER_TEMP"/pack/*.tgz | sort

      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error

  publish:
    name: Tag and stage the publish
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write # the version tag, made through the API
      id-token: write # npm's trusted publishing
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Fetch the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tag the commit
        if: needs.pack.outputs.already_tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" --jq .ref

      # Trusted publishing needs npm 11.5.1 or later, and `npm stage` a later 11. Exact, since this job holds the token.
      - name: Stage the publish
        run: |
          npm install --global npm@11.21.1
          npm stage publish --ignore-scripts package/*.tgz
